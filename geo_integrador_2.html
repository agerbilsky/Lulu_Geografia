<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Integrador 2</title><style>
:root{--paper:#F2F6F5;--ocean:#164E63;--land:#3F6B3A;--ochre:#B8791A;--ink:#1D2B2F;--muted:#5B6B70;--ok:#2F7D4F;--bad:#B42318;--line:#D5E0DF}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
header{position:relative;background:var(--ocean);color:#fff;padding:22px 20px 26px;overflow:hidden}
.topo{position:absolute;inset:0;width:100%;height:100%;color:rgba(255,255,255,.14)}
header .in{position:relative;max-width:680px;margin:0 auto}
header a{color:#CFE6EC;text-decoration:none;font-size:15px}
header a:focus-visible,button:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
h1{font-family:Charter,"Iowan Old Style",Georgia,serif;font-weight:700;font-size:28px;line-height:1.15;margin:10px 0 4px}
.sub{color:#CFE6EC;font-size:15px;margin:0}
main{max-width:680px;margin:0 auto;padding:20px 18px 60px}
.route{display:flex;align-items:center;gap:10px;margin:4px 0 18px;color:var(--muted);font-size:14px}
.track{flex:1;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 12px);position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--land);transition:width .35s}
.q{font-family:Charter,"Iowan Old Style",Georgia,serif;font-size:21px;line-height:1.35;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--ocean)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:#EAF5EE}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#FCEDEB}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-left:4px solid var(--ok);background:#fff;border-radius:0 10px 10px 0;font-size:15.5px}
.fb.no{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.next{margin-top:18px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ocean);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.score{font-family:Charter,"Iowan Old Style",Georgia,serif;font-size:64px;line-height:1;color:var(--ocean);margin:10px 0 4px}
.msg{font-size:18px;margin:0 0 20px}
.rev{margin-top:24px}
.rev h2{font-size:17px;margin:0 0 10px;color:var(--bad)}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:15px}
.item p{margin:0 0 6px}.item .yo{color:var(--bad)}.item .bien{color:var(--ok)}.item .ex{color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .next{flex:1;min-width:180px}
.ghost{background:#fff;color:var(--ocean);border:1.5px solid var(--ocean)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style></head><body>
<header><svg class="topo" viewBox="0 0 600 160" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1">

<path d="M-10 100 C90 70 150 118 240 88 S380 40 470 72 S585 108 620 80"/>
<path d="M-10 80 C100 52 160 96 250 66 S370 22 470 50 S590 86 620 60"/>
<path d="M-10 60 C110 34 170 74 260 44 S360 6 470 28 S595 64 620 40"/>

<ellipse cx="470" cy="40" rx="38" ry="14"/><ellipse cx="470" cy="40" rx="18" ry="6"/></g></svg><div class="in"><a href="index.html">‹ Todos los exámenes</a><h1>Integrador 2</h1><p class="sub">Geografía · Toda la unidad · 20 preguntas</p></div></header>
<main></main><script>const Q=[{"q": "¿Cuál de estas afirmaciones es FALSA según la unidad?", "o": ["América Latina es más pobre porque su población se esfuerza menos", "El centro concentra la industria, la tecnología y el control financiero", "La periferia ocupa una posición subordinada en el comercio mundial", "Las decisiones de las transnacionales se toman en sus sedes del centro"], "e": "El texto aclara que la diferencia NO se explica por falta de esfuerzo o capacidad, sino por el lugar que ocupa cada región."}, {"q": "Un texto dice que las empresas buscan salarios bajos y otro que prefieren lugares menos riesgosos aunque los salarios sean altos. ¿Cómo se explica?", "o": ["Para piezas simples buscan lo barato, pero la mayor parte de la inversión va a lugares seguros y rentables", "Uno de los dos textos está equivocado y hay que ignorarlo", "Las empresas cambian de idea todos los años sin ningún criterio", "Solo se buscan salarios bajos en los países desarrollados"], "e": "Las dos cosas pasan a la vez, y la conclusión es que la inversión reproduce la desigualdad."}, {"q": "¿Cuál de estos NO es un atributo de la fertilidad territorial?", "o": ["Tener la mayor superficie del continente", "La calidad de las infraestructuras de transporte y comunicaciones", "El costo y la calidad de la mano de obra", "Las ayudas políticas a la inversión"], "e": "El tamaño del territorio no aparece como atributo. Sí aparecen el riesgo-país, el clima de inversión y las empresas locales para subcontratar."}, {"q": "¿Qué consecuencia tiene que la fertilidad territorial esté repartida en forma desigual?", "o": ["Los lugares ya atractivos reciben más inversión y crecen más: se agranda la desigualdad", "Todos los territorios terminan creciendo al mismo ritmo", "Los lugares menos atractivos reciben la mayor parte de la inversión", "La inversión extranjera deja de existir"], "e": "El texto habla de un mapa de crecimiento divergente, con concentración y desigualdad."}, {"q": "¿Qué logran países periféricos como Brasil, China o India gracias a la dispersión territorial?", "o": ["Exportar productos tecnológicos de buen nivel", "Convertirse en los principales exportadores de servicios de consultoría", "Dejar de exportar cualquier tipo de producto", "Volver al modelo agroexportador"], "e": "Son periféricos de mayor desarrollo y diversificación."}, {"q": "¿Cuál fue el rol de las dictaduras militares en el avance del neoliberalismo?", "o": ["Desmantelaron las estructuras productivas previas y sentaron las bases del neoliberalismo", "Protegieron las industrias nacionales frente a la competencia extranjera", "Ampliaron los derechos laborales de los trabajadores", "Impidieron el endeudamiento con organismos internacionales"], "e": "Lo hicieron mediante el terrorismo de Estado, quitando derechos y garantías constitucionales."}, {"q": "Con la vuelta de los gobiernos democráticos, ¿qué pasó con la flexibilización laboral?", "o": ["Se profundizó", "Desapareció por completo", "Se prohibió por ley en toda la región", "Solo siguió en Estados Unidos"], "e": "El texto dice que en las décadas siguientes esta tendencia se profundizó en el continente."}, {"q": "¿Qué se privatizó con las políticas neoliberales?", "o": ["Empresas estatales de transporte, servicios y explotación de recursos naturales", "Solamente las escuelas públicas", "Las empresas transnacionales, que pasaron al Estado", "Nada: el Estado se quedó con todas sus empresas"], "e": "La privatización fue en paralelo a la reprimarización."}, {"q": "¿Por qué América Latina es uno de los principales destinos de la mercantilización de bienes naturales?", "o": ["Porque es una de las regiones más ricas del planeta en recursos naturales y biodiversidad", "Porque no tiene ningún recurso natural propio", "Porque es la región más industrializada del mundo", "Porque sus Estados prohibieron la inversión extranjera"], "e": "El texto dice que “no casualmente” es destino de privatización de sus bienes naturales."}, {"q": "¿Cuál es un ejemplo de desarrollo desigual y combinado?", "o": ["En la misma provincia hay campos con satélites y biotecnología y trabajadores rurales informales", "Todos los campos de un país usan la misma tecnología", "Un país que tiene solo industrias modernas", "Dos países que se desarrollan al mismo tiempo"], "e": "Lo moderno y lo empobrecido conviven; no es un atraso que se vaya a resolver solo."}, {"q": "¿Cómo cambió la división del trabajo con la globalización?", "o": ["Pasó a una división espacial más compleja: las empresas fragmentan la producción a escala planetaria", "Desapareció: ahora todos los países producen lo mismo", "Volvió a ser como en la época colonial, sin cambios", "Solo se aplica dentro de cada país, no entre países"], "e": "Se diseña en un lugar, se ensambla en otro y se extraen recursos en otro."}, {"q": "¿Cuál es el ejemplo típico de producción globalizada que da el texto de desarrollo-subdesarrollo?", "o": ["Diseño en EE. UU. o Europa, ensamblaje en países de salarios bajos y recursos extraídos de América Latina", "Diseño, fabricación y venta en un mismo país latinoamericano", "Diseño en América Latina y ensamblaje en Europa", "Todo se produce en China y se vende solo en China"], "e": "Muestra la división espacial del trabajo y la continuidad del esquema centro-periferia."}, {"q": "¿Qué consecuencia tuvo la victoria del norte en la Guerra de Secesión?", "o": ["Estados Unidos se volvió proveedor de manufacturas y luego potencia mundial", "Estados Unidos se volvió proveedor de materias primas para Europa", "Se mantuvo la esclavitud en todo el país", "Estados Unidos se dividió en dos países"], "e": "El proyecto industrial del norte se impuso sobre el sur terrateniente y esclavista."}, {"q": "¿Por qué a los grandes terratenientes latinoamericanos no les interesaba cambiar el modelo?", "o": ["Porque ganaban poder y riqueza exportando las materias primas que pedía Europa", "Porque querían que el país se industrializara rápidamente", "Porque no tenían tierras propias", "Porque vivían en Estados Unidos"], "e": "Por eso la emancipación política no se tradujo en emancipación económica."}, {"q": "Según el texto de la CEPAL, ¿por qué los países periféricos se endeudan?", "o": ["Porque necesitan divisas (dólares) para comprar la tecnología que no producen", "Porque exportan demasiada tecnología y les sobra dinero", "Porque el centro les compra las materias primas cada vez más caras", "Porque no comercian con ningún país"], "e": "La falta de industria propia genera dependencia estructural."}, {"q": "En la globalización, ¿qué son los “nodos”?", "o": ["Áreas muy dinámicas que funcionan como centros de desarrollo con influencia mundial", "Zonas que quedaron aisladas del comercio mundial", "Las fronteras entre países vecinos", "Los puertos donde se exportan materias primas en América Latina"], "e": "Mientras los nodos crecen, las áreas menos dinámicas retroceden: fragmentación espacial."}, {"q": "¿Qué tres cosas aumentaron con la globalización (apunte del 2/9)?", "o": ["El comercio internacional, la inversión extranjera directa y los flujos de capitales", "El comercio internacional, los aranceles y el control del Estado", "Los latifundios, la esclavitud y la inversión extranjera", "Las fronteras cerradas, los impuestos y el mercado interno"], "e": "Todo gracias a la flexibilización de fronteras y la eliminación de impuestos y restricciones."}, {"q": "¿Por qué las empresas cambiaron su forma de organizarse en la globalización?", "o": ["Para ser más flexibles y adaptarse rápido a los cambios del mercado", "Para volverse más lentas y estables", "Para depender más del Estado", "Para producir solo dentro de su país"], "e": "Es la transformación de la “morfología organizacional” de las empresas."}, {"q": "¿Cómo muestra el litio la idea de integración y fragmentación?", "o": ["Los salares se conectan con la economía mundial, pero las comunidades cercanas no necesariamente se benefician", "El litio se consume solamente dentro de Argentina", "Todas las personas de la región se benefician por igual", "El litio no se comercializa en el mercado internacional"], "e": "Se integra un punto al mercado mundial mientras gran parte de la población queda afuera."}, {"q": "¿Cuál es la mejor respuesta a: “¿Por qué una empresa extranjera instalaría una fábrica en América Latina en los años 70?”", "o": ["Para bajar costos: salarios bajos, menos derechos laborales y facilidades de los Estados", "Porque en América Latina los salarios eran los más altos del mundo", "Porque América Latina tenía la mejor tecnología del planeta", "Porque en su país de origen estaba prohibido fabricar"], "e": "Después de la crisis, los países centrales buscaron abaratar la producción trasladando fábricas."}];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);const main=$("main");
let ronda,i,ok,errores;
function start(){ronda=shuffle(Q).map(x=>({q:x.q,e:x.e,c:x.o[0],o:shuffle(x.o)}));i=0;ok=0;errores=[];show();}
function show(){const p=ronda[i];const L="ABCD";
 main.innerHTML=`<div class="route"><span>Pregunta ${i+1} de ${ronda.length}</span><div class="track"><div class="fill" style="width:${i/ronda.length*100}%"></div></div><span>${ok} ✓</span></div>
 <p class="q">${p.q}</p><div class="opts">${p.o.map((t,n)=>`<button class="opt" data-t="${n}"><span class="k">${L[n]}</span><span>${t}</span></button>`).join("")}</div><div id="after"></div>`;
 main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.t));window.scrollTo(0,0);}
function pick(n){const p=ronda[i];const bien=p.o[n]===p.c;if(bien)ok++;else errores.push({q:p.q,yo:p.o[n],c:p.c,e:p.e});
 main.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(p.o[k]===p.c)b.classList.add("ok");else if(k===n)b.classList.add("bad");else b.classList.add("dim")});
 const ult=i===ronda.length-1;
 $("#after").innerHTML=`<div class="fb ${bien?"":"no"}"><b>${bien?"¡Bien!":"No es esa."}</b>${p.e}</div><button class="next">${ult?"Ver mi resultado":"Siguiente pregunta"}</button>`;
 const nx=$("#after .next");nx.onclick=()=>{i++;ult?fin():show()};nx.focus({preventScroll:true});}
function fin(){const n=ronda.length,nota=Math.round(ok/n*10*10)/10;
 const m=ok===n?"Perfecto. Esta parte la tenés dominada.":nota>=8?"Muy bien. Repasá las que fallaste y listo.":nota>=6?"Aprobado, pero hay temas flojos: mirá abajo cuáles.":"Todavía no. Volvé al resumen en los temas de abajo y probá otra vez.";
 main.innerHTML=`<p class="route">Resultado</p><div class="score">${ok}/${n}</div><p class="msg">${m}</p>
 <div class="row"><button class="next" id="otra">Hacerlo de nuevo (otro orden)</button><a class="next ghost" href="index.html" style="text-align:center;text-decoration:none">Volver a los exámenes</a></div>
 ${errores.length?`<div class="rev"><h2>Para repasar (${errores.length})</h2>${errores.map(x=>`<div class="item"><p><b>${x.q}</b></p><p class="yo">Elegiste: ${x.yo}</p><p class="bien">Correcta: ${x.c}</p><p class="ex">${x.e}</p></div>`).join("")}</div>`:""}`;
 $("#otra").onclick=start;window.scrollTo(0,0);}
start();
</script></body></html>
