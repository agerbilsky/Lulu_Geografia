<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desarrollo y 2.ª Revolución Industrial</title><style>
:root{--paper:#F2F6F5;--ocean:#164E63;--land:#3F6B3A;--ochre:#B8791A;--ink:#1D2B2F;--muted:#5B6B70;--ok:#2F7D4F;--bad:#B42318;--line:#D5E0DF}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
header{position:relative;background:var(--ocean);color:#fff;padding:22px 20px 26px;overflow:hidden}
.topo{position:absolute;inset:0;width:100%;height:100%;color:rgba(255,255,255,.14)}
header .in{position:relative;max-width:680px;margin:0 auto}
header a{color:#CFE6EC;text-decoration:none;font-size:15px}
header a:focus-visible,button:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
h1{font-family:Charter,"Iowan Old Style",Georgia,serif;font-weight:700;font-size:28px;line-height:1.15;margin:10px 0 4px}
.sub{color:#CFE6EC;font-size:15px;margin:0}
main{max-width:680px;margin:0 auto;padding:20px 18px 60px}
.route{display:flex;align-items:center;gap:10px;margin:4px 0 18px;color:var(--muted);font-size:14px}
.track{flex:1;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 12px);position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--land);transition:width .35s}
.q{font-family:Charter,"Iowan Old Style",Georgia,serif;font-size:21px;line-height:1.35;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--ocean)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:#EAF5EE}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#FCEDEB}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-left:4px solid var(--ok);background:#fff;border-radius:0 10px 10px 0;font-size:15.5px}
.fb.no{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.next{margin-top:18px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ocean);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.score{font-family:Charter,"Iowan Old Style",Georgia,serif;font-size:64px;line-height:1;color:var(--ocean);margin:10px 0 4px}
.msg{font-size:18px;margin:0 0 20px}
.rev{margin-top:24px}
.rev h2{font-size:17px;margin:0 0 10px;color:var(--bad)}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:15px}
.item p{margin:0 0 6px}.item .yo{color:var(--bad)}.item .bien{color:var(--ok)}.item .ex{color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .next{flex:1;min-width:180px}
.ghost{background:#fff;color:var(--ocean);border:1.5px solid var(--ocean)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style></head><body>
<header><svg class="topo" viewBox="0 0 600 160" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1">
<path d="M-10 120 C80 90 140 140 230 110 S390 60 470 95 S580 130 620 100"/>
<path d="M-10 100 C90 70 150 118 240 88 S380 40 470 72 S585 108 620 80"/>
<path d="M-10 80 C100 52 160 96 250 66 S370 22 470 50 S590 86 620 60"/>
<path d="M-10 60 C110 34 170 74 260 44 S360 6 470 28 S595 64 620 40"/>
<path d="M120 150 C170 130 230 150 280 140 S360 120 400 150"/>
<ellipse cx="470" cy="40" rx="38" ry="14"/><ellipse cx="470" cy="40" rx="18" ry="6"/></g></svg><div class="in"><a href="index.html">‹ Todos los exámenes</a><h1>Desarrollo y 2.ª Revolución Industrial</h1><p class="sub">Geografía · Puntos 1 y 2 · Examen A · 10 preguntas</p></div></header>
<main></main><script>const Q=[{"q": "Según la visión “simplista” (la vieja), ¿qué es el subdesarrollo?", "o": ["Una etapa previa, un atraso que se supera con tiempo, inversión y modernización", "El resultado del lugar que ocupa cada país en un sistema mundial desigual", "Una situación causada únicamente por el clima y el relieve de cada país", "Un problema que solo existe en los países de África y Asia"], "e": "La visión vieja pensaba que todos los países siguen el mismo camino y que a América Latina solo le faltaba tiempo. La materia critica justamente esa idea."}, {"q": "Para la CEPAL, desarrollo y subdesarrollo son…", "o": ["Dos caras de una misma moneda: un solo sistema económico mundial que funciona de forma desigual", "Dos etapas independientes por las que pasan todos los países, una después de la otra", "El resultado del mayor o menor esfuerzo de la población de cada país", "Dos fenómenos sin ninguna relación entre sí"], "e": "La CEPAL mostró que el desarrollo de unos y el subdesarrollo de otros forman parte del mismo sistema centro-periferia."}, {"q": "¿Qué es la CEPAL?", "o": ["La Comisión Económica para América Latina y el Caribe, que a mediados del siglo XX cuestionó la visión simplista", "Un banco internacional que presta dinero a los países latinoamericanos", "Un tratado comercial firmado entre Estados Unidos y América Latina en 1930", "La organización de países exportadores de petróleo que subió los precios en 1973"], "e": "Es un organismo de economistas latinoamericanos. Creó el concepto de sistema centro-periferia. (La de 1973 es la OPEP)."}, {"q": "¿Qué caracteriza la estructura productiva de América Latina, según el texto?", "o": ["Se centra sobre todo en exportar bienes primarios: alimentos, minerales e hidrocarburos", "Se centra en fabricar manufacturas de alta tecnología para el mundo", "Se basa principalmente en exportar servicios financieros y de consultoría", "Tiene una industria automotriz propia que abastece a todo el planeta"], "e": "América Latina exporta sobre todo productos primarios, mientras América Anglosajona concentra industria, tecnología y altos ingresos."}, {"q": "Si en la prueba contestás que “los países producen distinto solo por la tierra y el clima”, ¿por qué te queda corta la respuesta?", "o": ["Porque lo que más pesa es el rol que le tocó a cada país en la economía mundial y las relaciones de poder", "Porque el clima y la tierra no tienen ninguna influencia en lo que produce un país", "Porque en realidad todos los países de América producen exactamente lo mismo", "Porque lo único que importa es la cantidad de habitantes de cada país"], "e": "Las condiciones naturales influyen, pero la unidad enseña que la especialización se explica por el lugar de cada país en el sistema mundial."}, {"q": "¿Cuándo se independizaron la mayoría de los países de América?", "o": ["Entre fines del siglo XVIII y principios del siglo XIX", "Entre fines del siglo XV y principios del siglo XVI", "Durante la Segunda Revolución Industrial, entre 1870 y 1914", "Después de la crisis del petróleo de 1973"], "e": "Justo cuando se independizaban, el mundo estaba cambiando por la industrialización, y se insertaron en esa economía global."}, {"q": "¿En qué período ubica el texto la Segunda Revolución Industrial?", "o": ["Aproximadamente entre 1870 y 1914", "Aproximadamente entre 1776 y 1810", "Aproximadamente entre 1930 y 1970", "Aproximadamente entre 1973 y 2000"], "e": "La Segunda Revolución Industrial se desarrolló aproximadamente entre 1870 y 1914."}, {"q": "¿Cuál de estas fue una característica de la Segunda Revolución Industrial?", "o": ["Grandes fábricas que producían más en menos tiempo, con nuevas energías, transportes y comunicaciones", "La vuelta a la producción artesanal en pequeños talleres familiares", "El abandono de las grandes ciudades y el regreso de la población al campo", "El fin del comercio entre países y el cierre de los mercados"], "e": "También implicó el paso de una organización basada en la agricultura hacia las grandes ciudades y el comercio mundial."}, {"q": "¿Por qué las potencias industriales competían por nuevos mercados?", "o": ["Necesitaban materias primas para sus fábricas y lugares donde vender lo que producían de más", "Querían dejar de fabricar y pasar a comprar todo en el exterior", "Buscaban evitar el comercio con otros países para protegerse", "Necesitaban vender materias primas porque no tenían industrias"], "e": "Producían tanto que su propio país no llegaba a consumirlo, y además necesitaban materias primas y alimentos para su población."}, {"q": "¿Qué significa que la expansión del capitalismo “fragmenta” el territorio?", "o": ["Que genera diferencias profundas: los países se desarrollan y entran al mercado de forma desigual", "Que divide a los países grandes en muchos Estados más pequeños", "Que elimina todas las fronteras entre los países del mundo", "Que hace que todos los países tengan el mismo nivel de desarrollo"], "e": "El capitalismo integra (elimina barreras y une territorios) y al mismo tiempo fragmenta (crea diferencias). De ahí surgen centro y periferia."}];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);const main=$("main");
let ronda,i,ok,errores;
function start(){ronda=shuffle(Q).map(x=>({q:x.q,e:x.e,c:x.o[0],o:shuffle(x.o)}));i=0;ok=0;errores=[];show();}
function show(){const p=ronda[i];const L="ABCD";
 main.innerHTML=`<div class="route"><span>Pregunta ${i+1} de ${ronda.length}</span><div class="track"><div class="fill" style="width:${i/ronda.length*100}%"></div></div><span>${ok} ✓</span></div>
 <p class="q">${p.q}</p><div class="opts">${p.o.map((t,n)=>`<button class="opt" data-t="${n}"><span class="k">${L[n]}</span><span>${t}</span></button>`).join("")}</div><div id="after"></div>`;
 main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.t));window.scrollTo(0,0);}
function pick(n){const p=ronda[i];const bien=p.o[n]===p.c;if(bien)ok++;else errores.push({q:p.q,yo:p.o[n],c:p.c,e:p.e});
 main.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(p.o[k]===p.c)b.classList.add("ok");else if(k===n)b.classList.add("bad");else b.classList.add("dim")});
 const ult=i===ronda.length-1;
 $("#after").innerHTML=`<div class="fb ${bien?"":"no"}"><b>${bien?"¡Bien!":"No es esa."}</b>${p.e}</div><button class="next">${ult?"Ver mi resultado":"Siguiente pregunta"}</button>`;
 const nx=$("#after .next");nx.onclick=()=>{i++;ult?fin():show()};nx.focus({preventScroll:true});}
function fin(){const n=ronda.length,nota=Math.round(ok/n*10*10)/10;
 const m=ok===n?"Perfecto. Esta parte la tenés dominada.":nota>=8?"Muy bien. Repasá las que fallaste y listo.":nota>=6?"Aprobado, pero hay temas flojos: mirá abajo cuáles.":"Todavía no. Volvé al resumen en los temas de abajo y probá otra vez.";
 main.innerHTML=`<p class="route">Resultado</p><div class="score">${ok}/${n}</div><p class="msg">${m}</p>
 <div class="row"><button class="next" id="otra">Hacerlo de nuevo (otro orden)</button><a class="next ghost" href="index.html" style="text-align:center;text-decoration:none">Volver a los exámenes</a></div>
 ${errores.length?`<div class="rev"><h2>Para repasar (${errores.length})</h2>${errores.map(x=>`<div class="item"><p><b>${x.q}</b></p><p class="yo">Elegiste: ${x.yo}</p><p class="bien">Correcta: ${x.c}</p><p class="ex">${x.e}</p></div>`).join("")}</div>`:""}`;
 $("#otra").onclick=start;window.scrollTo(0,0);}
start();
</script></body></html>
