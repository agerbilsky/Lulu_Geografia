<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Integrador 1</title><style>
:root{--paper:#F2F6F5;--ocean:#164E63;--land:#3F6B3A;--ochre:#B8791A;--ink:#1D2B2F;--muted:#5B6B70;--ok:#2F7D4F;--bad:#B42318;--line:#D5E0DF}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
header{position:relative;background:var(--ocean);color:#fff;padding:22px 20px 26px;overflow:hidden}
.topo{position:absolute;inset:0;width:100%;height:100%;color:rgba(255,255,255,.14)}
header .in{position:relative;max-width:680px;margin:0 auto}
header a{color:#CFE6EC;text-decoration:none;font-size:15px}
header a:focus-visible,button:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
h1{font-family:Charter,"Iowan Old Style",Georgia,serif;font-weight:700;font-size:28px;line-height:1.15;margin:10px 0 4px}
.sub{color:#CFE6EC;font-size:15px;margin:0}
main{max-width:680px;margin:0 auto;padding:20px 18px 60px}
.route{display:flex;align-items:center;gap:10px;margin:4px 0 18px;color:var(--muted);font-size:14px}
.track{flex:1;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 12px);position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--land);transition:width .35s}
.q{font-family:Charter,"Iowan Old Style",Georgia,serif;font-size:21px;line-height:1.35;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--ocean)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:#EAF5EE}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#FCEDEB}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-left:4px solid var(--ok);background:#fff;border-radius:0 10px 10px 0;font-size:15.5px}
.fb.no{border-left-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.next{margin-top:18px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ocean);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.score{font-family:Charter,"Iowan Old Style",Georgia,serif;font-size:64px;line-height:1;color:var(--ocean);margin:10px 0 4px}
.msg{font-size:18px;margin:0 0 20px}
.rev{margin-top:24px}
.rev h2{font-size:17px;margin:0 0 10px;color:var(--bad)}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:15px}
.item p{margin:0 0 6px}.item .yo{color:var(--bad)}.item .bien{color:var(--ok)}.item .ex{color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .next{flex:1;min-width:180px}
.ghost{background:#fff;color:var(--ocean);border:1.5px solid var(--ocean)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style></head><body>
<header><svg class="topo" viewBox="0 0 600 160" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1">

<main></main><script>const Q=[{"q": "¿Cuál es el orden cronológico correcto?", "o": ["Independencia de EE. UU. → Guerra de Secesión → 2.ª Revolución Industrial → crisis del petróleo", "Guerra de Secesión → independencia de EE. UU. → crisis del petróleo → 2.ª Revolución Industrial", "2.ª Revolución Industrial → independencia de EE. UU. → Guerra de Secesión → crisis del petróleo", "Independencia de EE. UU. → 2.ª Revolución Industrial → crisis del petróleo → Guerra de Secesión"], "e": "1776 → 1861-1865 → 1870-1914 → 1973."}, {"q": "¿Qué tienen en común el modelo agroexportador y la reprimarización actual?", "o": ["En los dos, América Latina depende de exportar productos primarios con poco valor agregado", "En los dos, América Latina se convierte en productora de alta tecnología", "En los dos, el Estado controla toda la economía", "En los dos, América Latina deja de comerciar con el exterior"], "e": "La reprimarización es como volver al viejo modelo, pero con tecnología moderna y empresas transnacionales."}, {"q": "¿Qué papel cumple China según el texto de neoliberalismo y reprimarización?", "o": ["Es un socio comercial desigual que agrava la reprimarización de América Latina", "Es un país periférico que le compra manufacturas a América Latina", "Es el organismo que prestó dinero a los países latinoamericanos", "Es el país que originó la Segunda Revolución Industrial"], "e": "China compra materias primas a la región y le vende manufacturas."}, {"q": "¿Qué son los agronegocios?", "o": ["Producción que combina campo, industria y comercio a gran escala, con mucho capital, tierras concentradas y tecnología", "Pequeñas huertas familiares que venden en ferias locales", "Empresas estatales dedicadas a repartir tierras", "Negocios que venden herramientas de jardinería"], "e": "Abarcan rubros como frutas, lácteos, carnes, granos, aceites, textiles y bebidas."}, {"q": "¿Qué es una maquila?", "o": ["Una fábrica que solo ensambla piezas, con salarios bajos y escaso valor agregado", "Un centro de investigación de alta tecnología", "Un gran campo dedicado a la ganadería", "Una empresa de servicios financieros"], "e": "El texto las nombra junto con las actividades primario-extractivas como parte de la reprimarización."}, {"q": "¿Qué relación hay entre globalización y desregulación?", "o": ["Se retroalimentan: la globalización necesita economías abiertas y los países desregulan para insertarse mejor", "Son opuestas: cuando hay globalización, el Estado pone más controles", "No tienen ninguna relación entre sí", "La desregulación terminó con la globalización"], "e": "Una empuja a la otra y juntas profundizan la nueva dinámica económica."}, {"q": "Trampa clásica: ¿qué es la TERCIARIZACIÓN?", "o": ["El crecimiento del sector servicios", "Contratar trabajadores a través de otras empresas", "La tercera etapa de la Revolución Industrial", "Que un país se especialice en materias primas"], "e": "TERCIARización = sector terciario (servicios). TERcerización = contratar a través de otra empresa."}, {"q": "La idea de “integración y fragmentación” aparece…", "o": ["Tanto en la expansión del capitalismo con la 2.ª Revolución Industrial como en la globalización", "Solamente en la época de la 2.ª Revolución Industrial", "Solamente en la globalización actual", "Solamente en el modelo industrialista de Estados Unidos"], "e": "En las dos épocas el capitalismo une territorios y al mismo tiempo genera diferencias entre ellos."}, {"q": "¿Cómo afecta la pérdida de control del Estado a los países periféricos?", "o": ["Compiten entre sí ofreciendo salarios bajos y menos reglas, y su desarrollo depende de lo que decidan las ETN", "Les permite desarrollarse de forma autónoma sin depender de nadie", "Hace que las empresas transnacionales pierdan poder", "Obliga a las ETN a invertir en partes iguales en todos los países"], "e": "Esto limita su capacidad de crecer de manera autónoma."}, {"q": "¿Qué son los “enclaves”?", "o": ["Islas de alta productividad conectadas con el mercado exterior dentro de un territorio pobre", "Barrios cerrados de las grandes ciudades", "Zonas donde está prohibida la inversión extranjera", "Países que no participan del comercio mundial"], "e": "Muestran el desarrollo desigual y combinado: la modernidad se concentra en algunos puntos."}, {"q": "Si el precio de los tractores sube y el de la soja baja, ¿qué le pasa a un país que exporta soja?", "o": ["Tiene que exportar más soja para comprar la misma cantidad de tractores", "Puede comprar más tractores con la misma soja", "No le afecta, porque los precios no tienen relación", "Empieza a fabricar tractores automáticamente"], "e": "Es el deterioro de los términos de intercambio."}, {"q": "¿Cuál fue el cambio CULTURAL de la globalización según el texto?", "o": ["La expansión del modelo de consumo, estilo de vida y valores de Estados Unidos a través de los medios", "La eliminación de impuestos y restricciones al comercio", "El abaratamiento del transporte de mercaderías", "El traslado de fábricas a países con salarios bajos"], "e": "Junto con sus valores, también se difundieron sus prejuicios y estereotipos."}, {"q": "¿Qué consecuencia tuvo la crisis del petróleo de 1973 en los países centrales?", "o": ["Cambiaron sus estrategias y trasladaron industrias a otros territorios para bajar costos", "Cerraron todas sus fábricas y se dedicaron a la agricultura", "Dejaron de comerciar con América Latina", "Aumentaron los derechos de los trabajadores en todo el mundo"], "e": "Así empieza la dispersión territorial de la producción."}, {"q": "¿Qué significa la tendencia a la concentración empresarial?", "o": ["Cada vez menos empresas, más grandes y en red, de cuyas decisiones depende el crecimiento de los países", "Que las empresas se instalan todas en el mismo edificio", "Que las pequeñas empresas familiares ganan cada vez más poder", "Que el Estado compra todas las empresas grandes"], "e": "Es una de las cuatro transformaciones producidas por la globalización y la desregulación."}, {"q": "¿Cómo se ve la relación centro-periferia en el ejemplo del litio?", "o": ["El litio se extrae en América Latina, pero las baterías se fabrican afuera, donde queda el valor agregado", "América Latina fabrica las baterías y las exporta a los países centrales", "Los países centrales extraen el litio y se lo venden a América Latina", "El litio no tiene relación con la división del trabajo"], "e": "Es la misma lógica de siempre: la periferia provee la materia prima."}, {"q": "¿Por qué el texto dice que el subdesarrollo NO es una “ausencia de desarrollo”?", "o": ["Porque es el resultado directo de la forma en que se produce la riqueza a escala global", "Porque en realidad todos los países están igual de desarrollados", "Porque el subdesarrollo desaparece solo con el paso del tiempo", "Porque solo depende de las decisiones de cada familia"], "e": "No es un vacío: es la otra cara del desarrollo del centro."}, {"q": "En el esquema del repaso del 23/9, ¿qué relación une al centro con la periferia?", "o": ["Dependencia / intercambio desigual", "Cooperación / intercambio justo", "Independencia total / aislamiento", "Competencia entre iguales"], "e": "Centro → América Anglosajona; periferia → América Latina; entre ambos, dependencia e intercambio desigual."}, {"q": "Antes de los años 70, ¿de qué se ocupaba el Estado?", "o": ["Planificar la economía, generar empleo, promover la industria, atender salud y educación y regular los mercados", "Solamente de cobrar impuestos a las importaciones", "Solamente de la defensa militar del territorio", "De nada: todo estaba en manos de empresas privadas"], "e": "Después, muchas de esas funciones pasaron a actores privados y entes reguladores."}, {"q": "¿Por qué eran tan valoradas las llanuras templadas de América Latina hasta 1930?", "o": ["Porque producían cereales y ganado, las materias primas que demandaba Europa", "Porque allí se instalaron las grandes fábricas de maquinarias", "Porque eran las zonas con más bancos y servicios financieros", "Porque eran zonas de montaña ricas en litio"], "e": "Encajaban con el rol de América Latina en la división internacional del trabajo."}, {"q": "¿Cuál es una diferencia entre los trenes de EE. UU. y los de América Latina?", "o": ["En EE. UU. conectaban el país hacia adentro (mercado interno); en América Latina solían llevar materias primas al puerto", "En EE. UU. solo llevaban pasajeros; en América Latina solo llevaban manufacturas", "En EE. UU. los trenes llegaron después que en América Latina", "No hay ninguna diferencia: cumplían la misma función"], "e": "El tren estadounidense amplió el mercado interno; el latinoamericano estaba pensado para exportar."}];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);const main=$("main");
let ronda,i,ok,errores;
function start(){ronda=shuffle(Q).map(x=>({q:x.q,e:x.e,c:x.o[0],o:shuffle(x.o)}));i=0;ok=0;errores=[];show();}
function show(){const p=ronda[i];const L="ABCD";
 main.innerHTML=`<div class="route"><span>Pregunta ${i+1} de ${ronda.length}</span><div class="track"><div class="fill" style="width:${i/ronda.length*100}%"></div></div><span>${ok} ✓</span></div>
 <p class="q">${p.q}</p><div class="opts">${p.o.map((t,n)=>`<button class="opt" data-t="${n}"><span class="k">${L[n]}</span><span>${t}</span></button>`).join("")}</div><div id="after"></div>`;
 main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.t));window.scrollTo(0,0);}
function pick(n){const p=ronda[i];const bien=p.o[n]===p.c;if(bien)ok++;else errores.push({q:p.q,yo:p.o[n],c:p.c,e:p.e});
 main.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(p.o[k]===p.c)b.classList.add("ok");else if(k===n)b.classList.add("bad");else b.classList.add("dim")});
 const ult=i===ronda.length-1;
 $("#after").innerHTML=`<div class="fb ${bien?"":"no"}"><b>${bien?"¡Bien!":"No es esa."}</b>${p.e}</div><button class="next">${ult?"Ver mi resultado":"Siguiente pregunta"}</button>`;
 const nx=$("#after .next");nx.onclick=()=>{i++;ult?fin():show()};nx.focus({preventScroll:true});}
function fin(){const n=ronda.length,nota=Math.round(ok/n*10*10)/10;
 const m=ok===n?"Perfecto. Esta parte la tenés dominada.":nota>=8?"Muy bien. Repasá las que fallaste y listo.":nota>=6?"Aprobado, pero hay temas flojos: mirá abajo cuáles.":"Todavía no. Volvé al resumen en los temas de abajo y probá otra vez.";
 main.innerHTML=`<p class="route">Resultado</p><div class="score">${ok}/${n}</div><p class="msg">${m}</p>
 <div class="row"><button class="next" id="otra">Hacerlo de nuevo (otro orden)</button><a class="next ghost" href="index.html" style="text-align:center;text-decoration:none">Volver a los exámenes</a></div>
 ${errores.length?`<div class="rev"><h2>Para repasar (${errores.length})</h2>${errores.map(x=>`<div class="item"><p><b>${x.q}</b></p><p class="yo">Elegiste: ${x.yo}</p><p class="bien">Correcta: ${x.c}</p><p class="ex">${x.e}</p></div>`).join("")}</div>`:""}`;
 $("#otra").onclick=start;window.scrollTo(0,0);}
start();
</script></body></html>
